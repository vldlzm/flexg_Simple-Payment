<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Payment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 좌측: 인덱스 -->
        <aside class="sidebar-left">
            <div class="sidebar-header">
                <h2>인덱스</h2>
            </div>
            <nav class="index-menu">
                <ul>
                    <li><a href="#" class="menu-item active" onclick="selectItem(this, 0)">상품 상세</a></li>
                </ul>
            </nav>
        </aside>

        <!-- 중앙: 화면 -->
        <main class="main-content">
            <div class="content-header">
                <h1>상품 상세</h1>
            </div>
            <div class="content-body">
                <div class="screen" id="screen-0" style="display: block;">
                    <div class="pdv-page">
                        <!-- 헤더 -->
                        <div class="pdv-header">
                            <button class="pdv-back-btn">&#8592;</button>
                            <span class="pdv-title-text">상품정보</span>
                            <div class="pdv-header-right">
                                <button class="pdv-hicon">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
                                        <path d="M9 21V12h6v9"/>
                                    </svg>
                                </button>
                                <button class="pdv-hicon">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                                        <line x1="3" y1="6" x2="21" y2="6"/>
                                        <path d="M16 10a4 4 0 01-8 0"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- 스크롤 영역 -->
                        <div class="pdv-body">
                            <!-- 상품 이미지 -->
                            <div class="pdv-img-wrap">
                                <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" class="pdv-product-img">
                                    <!-- 밝은 흰 배경 -->
                                    <rect width="400" height="500" fill="#f5f4f2"/>
                                    <!-- 패브릭 주름 효과 (매우 연하게) -->
                                    <path d="M0 300 Q70 282 150 300 Q230 318 310 295 Q360 282 400 290" stroke="#e8e5e0" stroke-width="4" fill="none"/>
                                    <path d="M0 340 Q90 325 190 342 Q280 358 400 335" stroke="#e8e5e0" stroke-width="3" fill="none"/>
                                    <path d="M0 390 Q80 375 170 392 Q260 408 350 388 Q380 382 400 385" stroke="#eae7e2" stroke-width="2.5" fill="none"/>
                                    <path d="M0 430 Q100 418 200 433 Q300 448 400 428" stroke="#eae7e2" stroke-width="2" fill="none"/>
                                    <!-- 튜브 그림자 -->
                                    <ellipse cx="200" cy="448" rx="68" ry="9" fill="#ccc8c0" opacity="0.25"/>
                                    <!-- 튜브 몸통 (흰색) -->
                                    <rect x="158" y="92" width="84" height="330" rx="15" fill="#fafaf8"/>
                                    <rect x="158" y="92" width="84" height="330" rx="15" fill="none" stroke="#e5e2dc" stroke-width="1.2"/>
                                    <!-- 튜브 왼쪽 하이라이트 -->
                                    <rect x="161" y="95" width="11" height="324" rx="5.5" fill="rgba(255,255,255,0.75)"/>
                                    <!-- 튜브 오른쪽 그림자 -->
                                    <rect x="231" y="95" width="9" height="324" rx="4.5" fill="rgba(200,196,190,0.18)"/>
                                    <!-- 튜브 캡 -->
                                    <rect x="167" y="70" width="66" height="26" rx="9" fill="#f0ede7"/>
                                    <rect x="167" y="70" width="66" height="26" rx="9" fill="none" stroke="#dedad4" stroke-width="1"/>
                                    <!-- 캡 하이라이트 -->
                                    <rect x="170" y="72" width="20" height="10" rx="5" fill="rgba(255,255,255,0.6)"/>
                                    <!-- 브랜드명 -->
                                    <text x="200" y="184" font-size="14.5" text-anchor="middle" fill="#3a3a3a" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="600">Nécessaire</text>
                                    <!-- 제품명 라인1 -->
                                    <text x="200" y="204" font-size="9" text-anchor="middle" fill="#666" font-family="Georgia,serif">The Body Lotion</text>
                                    <!-- 제품명 라인2 -->
                                    <text x="200" y="221" font-size="9" text-anchor="middle" fill="#666" font-family="Georgia,serif">L'Emulsion Corps</text>
                                    <!-- 구분선 -->
                                    <line x1="172" y1="242" x2="228" y2="242" stroke="#dedad4" stroke-width="0.8"/>
                                    <!-- 하단 작은 텍스트 -->
                                    <text x="200" y="375" font-size="7" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" letter-spacing="1.2">FRAGRANCE FREE</text>
                                    <text x="200" y="390" font-size="5.8" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif">300 ml / 10.1 fl oz</text>
                                </svg>
                            </div>

                            <!-- 재고 알림 -->
                            <div class="pdv-stock-bar">
                                한정 수량 <span class="pdv-stock-num">205</span> 개 남음
                            </div>

                            <!-- 상품 정보 -->
                            <div class="pdv-info">
                                <p class="pdv-brand-label">PREMIUM LINE</p>
                                <h2 class="pdv-product-name">Whitening Body Lotion</h2>

                                <!-- 가격 1행 -->
                                <div class="pdv-price-row1">
                                    <span class="pdv-orig-price">25,000원</span>
                                    <span class="pdv-disc-pct">60%</span>
                                </div>
                                <!-- 가격 2행 -->
                                <div class="pdv-price-row2">
                                    <span class="pdv-final-price">10,000원</span>
                                    <div class="pdv-point-wrap">
                                        <button class="pdv-point-btn">포인트 받기! &#8594;</button>
                                        <span class="pdv-point-coin">
                                            <svg width="30" height="30" viewBox="0 0 30 30">
                                                <circle cx="15" cy="15" r="14" fill="#f5a623"/>
                                                <circle cx="15" cy="15" r="10" fill="#e8961a" opacity="0.3"/>
                                                <text x="15" y="19" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Arial">₩</text>
                                            </svg>
                                        </span>
                                    </div>
                                </div>

                                <!-- 구매수량 제한 -->
                                <div class="pdv-qty-row">
                                    <span class="pdv-qty-label">· 구매수량 제한</span>
                                    <span class="pdv-qty-val">최소 1개 이상 최대 10개 이하</span>
                                </div>

                                <!-- 구매 통계 -->
                                <div class="pdv-stats-row">
                                    <span class="pdv-buying-cnt"><strong>222</strong>개 구매중</span>
                                    <div class="pdv-reactions">
                                        <span class="pdv-heart-cnt">
                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                                            17
                                        </span>
                                        <span class="pdv-star-cnt">
                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="#f5a623" stroke="#f5a623" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                            13
                                        </span>
                                    </div>
                                </div>

                                <!-- 쿠폰 행 -->
                                <div class="pdv-coupon-row">
                                    <span class="pdv-disc-msg">상품 할인받고 구매하세요!</span>
                                    <button class="pdv-coupon-btn">쿠폰 받기</button>
                                </div>
                            </div>
                        </div>

                        <!-- 하단 고정 바 -->
                        <div class="pdv-bottom">
                            <div class="pdv-cart-row">
                                <button class="pdv-wish-btn">
                                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M14 24s-9-5.5-9-12a5 5 0 0110 0 5 5 0 0110 0c0 6.5-9 12-9 12z" stroke="#555" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
                                        <line x1="14" y1="3" x2="14" y2="1" stroke="#555" stroke-width="1.4" stroke-linecap="round"/>
                                        <line x1="5" y1="6" x2="3.5" y2="4.5" stroke="#555" stroke-width="1.4" stroke-linecap="round"/>
                                        <line x1="23" y1="6" x2="24.5" y2="4.5" stroke="#555" stroke-width="1.4" stroke-linecap="round"/>
                                        <line x1="2" y1="14" x2="0.5" y2="14" stroke="#555" stroke-width="1.4" stroke-linecap="round"/>
                                        <line x1="26" y1="14" x2="27.5" y2="14" stroke="#555" stroke-width="1.4" stroke-linecap="round"/>
                                    </svg>
                                </button>
                                <button class="pdv-buy-btn">구매하기</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 우측: 화면설명 -->
        <aside class="sidebar-right">
            <div class="sidebar-header">
                <h2>화면 설명</h2>
            </div>
            <div class="description-content">
                <div class="description-section">
                    <h4>현재 화면</h4>
                    <p id="current-title">상품 상세</p>
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
